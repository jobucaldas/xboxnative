name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          bash -n xn
      - name: python compile
        run: |
          set -e
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m py_compile
      - name: synthetic input routing fixture
        run: bash src/xbox-test/uwph/input/tests/run-route-test.sh
      - name: DPI awareness context encoding
        run: bash src/xbox-test/uwph/user32/tests/run-dpi-context-test.sh
      - name: synthetic pad HID device layout
        run: bash src/xbox-test/uwph/hid/tests/run-pad-device-test.sh
      - name: synthetic pad handle registry and hid.dll answers
        run: bash src/xbox-test/uwph/hid/tests/run-pad-registry-test.sh
      - name: "cmd.txt gpad pad-injection: parser, timing and release"
        run: c++ -std=c++17 -O2 -Wall -Wextra -Werror -Isrc/xbox-test/uwph/xinput src/xbox-test/uwph/xinput/gpad-test.cpp -o /tmp/gpad-test && /tmp/gpad-test
      - name: offline unit tests
        run: |
          set -e
          python3 -I src/tools/tests/test_source_layout.py
          python3 -I src/xbox-test/app/tests/include-scope-test.py
          bash src/xbox-test/app/tests/session-restore.sh
          bash src/xbox-test/app/tests/launch-status.sh
          bash src/xbox-test/app/tests/launch-target.sh
          bash src/xbox-test/app/tests/selftest-plan.sh
          bash src/xbox-test/app/tests/play-d3d11-so-state.sh
          bash src/xbox-test/app/tests/play-d3d12-order.sh
          bash src/xbox-test/app/tests/d3d12-readback-contract.sh
          bash src/xbox-test/app/tests/d3d10-readback-contract.sh
          bash src/xbox-test/app/tests/steam-app-ticket.sh
          bash src/xbox-test/app/tests/steam-client-package.sh
          bash src/xbox-test/app/tests/launch-report.sh
          bash src/xbox-test/app/tests/redact.sh
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/x86-route.cpp -o /tmp/x86-route-test
          /tmp/x86-route-test
          python3 -I src/xbox-test/app/tests/launch-result-test.py
          python3 -I src/xbox-test/app/tests/wine-probe-test.py
          python3 -I src/xbox-test/tools/tests/test_play_test_transport.py
          python3 -I src/xbox-test/tools/tests/test_xn.py
          python3 -m unittest src/xbox-test/app/tests/test_store_badge.py
          python3 -m unittest src/xbox-test/dp/test-verify-depot.py
          python3 -m unittest discover -s src/xbox-test/app/donors -p 'test_*.py'
          python3 -m unittest discover -s src/xbox-test/kit -p 'test_*.py'
          python3 -m unittest src/tools/tests/test_pe_drop_empty_pdata.py
          python3 -m unittest discover -s src/xbox-test/uwph/display -p 'test_*.py'
          python3 -I -m unittest discover -s src/tools/xbox/tests -p 'test_load_config.py'
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/apibadge_test.cpp -o /tmp/apibadge-test
          /tmp/apibadge-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/shared/tests/wine_load_config_test.cpp -o /tmp/wine-config-test
          /tmp/wine-config-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/shared/tests/msvc_load_config_test.cpp -o /tmp/msvc-config-test
          /tmp/msvc-config-test
          bash src/xbox-test/app/tests/steam_cloud_test.sh
          bash src/xbox-test/app/tests/http-concurrent-state.sh
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/steam_achievements_test.cpp -o /tmp/steam-achievements-test
          /tmp/steam-achievements-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/steam_presence_test.cpp -o /tmp/steam-presence-test
          /tmp/steam-presence-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/steam_leaderboards_test.cpp -o /tmp/steam-leaderboards-test
          /tmp/steam-leaderboards-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/steam_lobbies_test.cpp -o /tmp/steam-lobbies-test
          /tmp/steam-lobbies-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/steam_host_test.cpp -o /tmp/steam-host-test
          /tmp/steam-host-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/steam_persona_test.cpp -o /tmp/steam-persona-test
          /tmp/steam-persona-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/game_library_test.cpp -o /tmp/game-library-test
          /tmp/game-library-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/detail-input.cpp -o /tmp/detail-input-test
          /tmp/detail-input-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/playable_test.cpp -o /tmp/playable-test
          /tmp/playable-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/detail-after-download.cpp -o /tmp/detail-after-download-test
          /tmp/detail-after-download-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror src/xbox-test/app/tests/depot_select_test.cpp -o /tmp/depot-select-test
          /tmp/depot-select-test
          python3 src/xbox-test/app/depot-fixtures/validate-vectors.py
      - name: strict resolver policy unit test
        run: bash src/xbox-test/uwph/strict-policy/tests/run-policy-test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: offline VRX log reviewer tests
        run: |
          node --test src/xbox-test/vrx/tests/check-vrx-log.test.mjs src/xbox-test/vrx/tests/review-vrx-log.test.mjs
      - name: build scripts parse their pins (offline)
        run: |
          set -e
          bash src/tools/build-wine-donors.sh --dry-run
          bash src/tools/fetch-boxedwine.sh --dry-run
          bash src/tools/build-mesa-d3d12.sh --dry-run
          bash src/tools/tests/test_build_mesa_d3d12.sh
          bash src/tools/build-vulkan-loader.sh --dry-run
          bash src/tools/tests/test_build_vulkan_loader.sh
          bash src/tools/build-mesa-dzn.sh --dry-run
          bash src/tools/tests/test_build_mesa_dzn.sh
      - name: no secrets / binaries committed
        run: |
          if git ls-files | grep -E '\.(pfx|key|pem|exe|dll|so|msix|appx|zip|7z|tar|gz|xz)$'; then
            echo "forbidden binary/secret file types are committed (build third-party binaries with src/tools/build-*.sh instead)"; exit 1
          fi
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|tskey-[A-Za-z0-9-]{10,}|7656119[0-9]{10}' -- . ':!.github'; then
            echo "possible secret or SteamID committed"; exit 1
          fi
  registry-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install registry test toolchain
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 wine64 wine lld
      - name: Registry persistence and write-failure regression
        run: bash src/xbox-test/uwph/host/run-reg-selftest.sh
      - name: "Audio ABI contract: XAudio2 and WASAPI SDK signatures"
        run: bash src/xbox-test/audio/tests/xaudio2-contract.sh
      - name: Registry crash consistency (eight cycles)
        run: bash src/xbox-test/uwph/host/run-reg-killtest.sh
      - name: Inert Wine config opt-in and active-config rejection
        run: bash src/xbox-test/uwph/host/tests/run-load-config.sh
      - name: Launcher mapped-image load-config rejection
        run: bash src/xbox-test/app/tests/load-config.sh
      - name: PE32+ unwind registration accepts sorted ranges and rejects corrupt tables
        run: bash src/xbox-test/app/tests/unwind-registration.sh
      - name: Delete game removes only its install folder
        run: bash src/xbox-test/app/tests/game-delete.sh
      - name: Storage move copies, verifies and markers atomically
        run: bash src/xbox-test/app/tests/move-game.sh
      - name: Install marker requires payload (health check)
        run: bash src/xbox-test/app/tests/install-health.sh
      - name: Free space figures and launcher leftovers
        run: bash src/xbox-test/app/tests/storage-report.sh
      - name: UI toolkit, launcher screens, guide overlay and unlock logic (native renders and asserts)
        run: |
          bash src/xbox-test/app/tests/ui-render.sh
          bash src/xbox-test/app/tests/ui-launcher.sh
          bash src/xbox-test/app/tests/ui-guide.sh
          bash src/xbox-test/app/tests/ui-nav.sh
          bash src/xbox-test/app/tests/ui-unlocks.sh
      # The legacy->flip swap-chain conversion both guest routes share (the
      # factory's CreateSwapChain override and D3D11CreateDeviceAndSwapChain):
      # host logic, so Wine runs it headless.
      - name: Shared legacy swap-chain conversion rules
        run: bash src/xbox-test/app/tests/swap-chain-convert.sh
      # The GPU drain the ResizeBuffers hook runs must submit the event query
      # (End, Flush) before polling GetData; fake COM objects assert the exact
      # call order. Host logic, so Wine runs it headless.
      - name: Resize drain submits the query before waiting on it
        run: bash src/xbox-test/app/tests/drain-order.sh
      # The launcher's guest watchdog decision: a contained fault or a finished
      # guest thread reports dead immediately, present silence only past the
      # threshold, out-of-order QPC reads never read as silence, and the math
      # is safe near a QPC wrap. Pure logic, Wine headless.
      - name: Guest watchdog decision reports dead by fault, exit and silence
        run: bash src/xbox-test/app/tests/guest-watchdog.sh
      # The round-6 redesign (bugbot r4559305219): while dead the launcher
      # presents its OWN composition surface and must never touch the guest's
      # device, context or swap chain (the guest may be blocked inside
      # Present; the immediate context is not free-threaded). This grep-style
      # audit fails CI if the dead branch of Run() regains a guest-side call.
      - name: Dead-path source audit keeps guest objects out of the dead branch
        run: bash src/xbox-test/app/tests/dead-path-audit.sh
      # The opt-in present pacing (LocalState\present.txt): parse errors fall
      # back to off, sync clamps to 0..4, and the fps-cap limiter spaces
      # presents one slot apart on a fake clock. The header is pure (no
      # WinRT/COM), so this compiles with mingw and runs headless.
      - name: "Present pacing: parse, sync clamp, fake-clock cap"
        run: bash src/xbox-test/app/tests/present-pacing.sh
      # Every vtable slot the diagnostics and the swap-chain overlay hook by
      # number is checked against the SDK's own vtbl structs with offsetof; a
      # drifted slot fails this build instead of forwarding to the wrong method
      # on the console. Compile-only, no device or Wine needed.
      - name: D3D11 diagnostics slot audit against the SDK vtable order
        run: bash src/xbox-test/app/tests/d3d11-diag-slots.sh
      # The dead page's DirectComposition slots (bugbot r4559524004): the
      # real <dcomp.h> declares SetContent at vtable slot 15; the slots
      # main.cpp relies on are derived from that header with a
      # pointer-to-member walker and asserted, so a hand-counted or drifted
      # slot fails CI instead of forwarding to the wrong method. mingw g++
      # (the crossbuild's family), Wine headless.
      - name: DComp dead-page slot audit against the real dcomp.h
        run: bash src/xbox-test/app/tests/dcomp-slots.sh
      # The redundant-resize elision decision (host/resize_elide.h): same-mode
      # requests elide, real differences forward, BufferCount 0 and
      # DXGI_FORMAT_UNKNOWN normalise to keep, the waitable flag bit strips,
      # and the resizeelide.txt opt-out parses. Pure functions, host toolchain.
      - name: "Redundant-resize elision decision unit tests"
        run: bash src/xbox-test/app/tests/resize-elision.sh
      # Every VK_SUCCESS check in the Vulkan fixtures must report the real
      # VkResult; a literal 0 beside one is exactly what masked the console's
      # real failure as "vkEndCommandBuffer result=0" (PR #195). Scan-only.
      - name: Vulkan fixture VkResult passthrough audit
        run: bash src/xbox-test/app/tests/vk-result-audit.sh
  strict-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cross compiler and Wine
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 llvm lld wine64
      - name: exercise strict named and ordinal imports
        run: bash src/xbox-test/uwph/host/tests/run-strict-imports.sh --run
      - name: retain logging in the SWC mapped-entry caller
        run: bash src/xbox-test/uwph/host/tests/run-swc-logging.sh
  guest-pe-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install PE inspection tools
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 llvm lld
      - name: inspect synthetic no-CRT guest
        run: bash src/xbox-test/uwph/guest-fixture/check-pe.sh
  u32c-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cross compiler, PE tools and Wine
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 llvm lld wine64 wine
      # The mapped regression PE gates every Play launch, and it runs inside the
      # launcher's own process where the UI thread publishes the connected pad
      # slots every frame. Running it only with no pad connected is what let a
      # stale empty-device-list assertion reach the console and block every
      # launch once a pad was plugged in; this runs it with pads published too,
      # and twice in one process (the gate is re-entrant: a failed run is
      # retried, and a self-test step can follow a PE32 fixture).
      - name: mapped user32 regression PE with pads published, and twice in one process
        run: bash src/xbox-test/uwph/user32/tests/run-u32c-gate-test.sh
  d3d10-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cross compiler and PE tools
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: g++-mingw-w64-x86-64 llvm lld
      # Build and inspect only: the shim must import nothing but what Play routes,
      # have no writable code section, and export the entry points. Driving it
      # against Wine's d3d11 is src/xbox-test/uwph/d3d10/test.sh, run locally.
      - name: build the D3D10 shim and inspect its PE
        run: bash src/xbox-test/uwph/d3d10/build.sh "$RUNNER_TEMP/d3d10-shim"
  d3d9-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cross compiler and PE tools
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: g++-mingw-w64-x86-64 llvm lld wine64
      # Build/inspect the shim and compile its managed texture descriptor
      # regression; the device-backed Wine contract remains a local test.
      - name: build the D3D9 shim and inspect its PE
        run: bash src/xbox-test/uwph/d3d9/build.sh "$RUNNER_TEMP/d3d9-shim"
      # The shim translates shader model 1-3 bytecode with this DLL, which it
      # loads by name from the runtime directory. Building it here proves the
      # pinned donor still compiles CRT-free and keeps its single export.
      - name: build the D3D9 shader translator and inspect its PE
        run: bash src/tools/build-d3d9-translator.sh "$RUNNER_TEMP/d3d9-translator"
      # The console's d3d9-triangle selftest faults on the fixed-function
      # POSITIONT path this regression pins: the translator must emit the
      # POSITIONT input with the SV_Position system value in both signatures.
      # The driver never opens a d3d11 device, so headless CI can run it.
      - name: D3D9 translator POSITIONT signature regression
        run: bash src/tools/d3d9-translator/test-positiont.sh "$RUNNER_TEMP/d3d9-translator"
      # The console's d3d9-triangle selftest faulted inside dxilconv because the
      # fixed-function pixel shader declared a sampler for a stage that never
      # reads its texture. This regression pins the fix: the textureless stage's
      # DXBC carries no dcl_sampler/dcl_resource/sample, and the textured one
      # keeps all three. The driver includes ffp.h itself, so the tokens are the
      # shim's own, and it never opens a d3d11 device (headless CI can run it).
      - name: D3D9 fixed-function pixel shader texture-stage regression
        run: bash src/tools/d3d9-translator/test-ffp-no-texture.sh "$RUNNER_TEMP/d3d9-translator"
      # Compile-time regression: the shim's managed 2x2 texture descriptor
      # must be DEFAULT + SRV with no CPU access or misc flags.
      - name: D3D9 managed texture descriptor regression
        run: x86_64-w64-mingw32-g++ -std=c++17 -fsyntax-only src/xbox-test/uwph/d3d9/test.cpp
  diag-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cross compilers and PE tools
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: g++-mingw-w64-x86-64 gcc-mingw-w64-i686 llvm lld
      # The console self-test's fixtures must build from source at package time
      # and stay small; the script fails on either. Running them is the console's
      # job (LocalState\selftest.txt).
      - name: build the console self-test fixtures
        run: bash src/xbox-test/app/tests/build-diag-fixtures.sh "$RUNNER_TEMP/diag"
  x86-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install i686 cross compiler
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-mingw-w64-i686 g++-mingw-w64-i686 wine wine64
      - name: x86 execution core (hardware-compared ALU, faults, thunks, owned i686 fixture)
        run: bash src/xbox-test/app/tests/x86-core.sh
      - name: "x86 guest surface (mingw CRT program through the interpreter: printf, heap, TLS, VirtualAlloc)"
        run: bash src/xbox-test/app/tests/x86-guest.sh
      - name: "x86 D3DX9 math registrations and semantics"
        run: bash src/xbox-test/app/tests/x86-d3dx.sh
      - name: "x86 kernel32 synchronization handle semantics"
        run: bash src/xbox-test/app/tests/x86-sync.sh
      - name: "x86 guest DLL loading (PE32 chain, DllMain, LoadLibrary/GetProcAddress, OS forwarders, cycles)"
        run: bash src/xbox-test/app/tests/x86-dll.sh
      - name: "x86 implicit TLS (PE32 TLS directory, block copy, callbacks; negative control)"
        run: bash src/xbox-test/app/tests/x86-tls.sh
      - name: "x86 COM thunks (guest proxies, vtable stubs, refcounts, fault-by-name against a mock host object)"
        run: bash src/xbox-test/app/tests/x86-com.sh
      - name: "x86 launch route (i686 fixture through the launcher's PE32 entry point and result mapping)"
        run: bash src/xbox-test/app/tests/x86-launch-route.sh
      - name: "x86 API-set imports (api-ms-win-crt/core names bind by the documented policy; unmapped names stay unresolved; UCRT arity table)"
        run: bash src/xbox-test/app/tests/x86-apiset.sh
      - name: "x86 API-set CRT structure layout comparison"
        run: bash src/xbox-test/app/tests/x86-apiset-layout.sh
      - name: "x86 C++ runtime fixture (iostream, std::string, exceptions, std::thread)"
        run: bash src/xbox-test/app/tests/x86-cxxrt.sh
      - name: "x86 C++ runtime fixture, wine cross-check (skips when wine cannot run PE32)"
        run: bash src/xbox-test/app/tests/x86-cxxrt.sh --wine
  # TODO: on-device sections of src/xbox-test/smoke-all.sh need a console and cannot run in GitHub Actions.
