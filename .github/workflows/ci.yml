name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: python compile
        run: |
          set -e
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m py_compile
      - name: offline unit tests
        run: |
          set -e
          bash xbox-test/app/tests/session-restore.sh
          python3 -m unittest xbox-test/dp/test-verify-depot.py
      - name: strict resolver policy unit test
        run: bash xbox-test/uwph/strict-policy/tests/run-policy-test.sh
      - name: build scripts parse their pins (offline)
        run: |
          set -e
          bash tools/build-wine-donors.sh --dry-run
          bash tools/fetch-boxedwine.sh --dry-run
      - name: no secrets / binaries committed
        run: |
          if git ls-files | grep -E '\.(pfx|key|pem|exe|dll|so|msix|appx|zip|7z|tar|gz|xz)$'; then
            echo "forbidden binary/secret file types are committed (build third-party binaries with tools/build-*.sh instead)"; exit 1
          fi
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|tskey-[A-Za-z0-9-]{10,}|7656119[0-9]{10}' -- . ':!.github'; then
            echo "possible secret or SteamID committed"; exit 1
          fi
  guest-pe-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install PE inspection tools
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 llvm lld
      - name: inspect synthetic no-CRT guest
        run: bash xbox-test/uwph/guest-fixture/check-pe.sh
  # TODO: on-device sections of xbox-test/smoke-all.sh need a console and cannot run in GitHub Actions.
